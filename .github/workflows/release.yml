name: Release

# A tag is the whole publish step:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# mac-app, on macos-14, publishes the GitHub Release (DMG and zip)
# and signs the zip. The Sparkle feed is a release asset. Installed
# 0.1.3 still reads appcast.xml from main, so that copy is updated
# through a pull request. Docker is not part of it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, such as v0.1.0
        required: true

permissions:
  contents: read

# One release at a time. A second run waits so two uploads of the same tag
# do not replace each other's assets mid-publish.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mac-app:
    runs-on: macos-14
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The version lives in VERSION. The tag has to agree with it: the
      # disk image name and CFBundleShortVersionString both come from that
      # file. A mismatch would publish one version under another's name.
      - name: Tag and VERSION must agree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG  VERSION=$FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match VERSION ($FILE). Bump VERSION, commit, then re-tag."
            exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      - name: The changelog has an entry for this version
        run: |
          if ! python3 Scripts/changelog.py "$VERSION" >/dev/null; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry. Write it, commit, then re-tag."
            exit 1
          fi
          if ! python3 Scripts/changelog.py "$VERSION" --zh >/dev/null; then
            echo "::error::CHANGELOG.zh-CN.md has no '## $VERSION' entry. Write the Chinese notes, commit, then re-tag."
            exit 1
          fi

      - name: Free disk space
        run: |
          rm -rf ~/Library/Developer/CoreSimulator || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          df -h /

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: XcodeGen
        run: brew install xcodegen

      # setup-node builds the workspace. The binary copied into the app has
      # to be the official tarball: Scripts/bundle.sh refuses a Node that
      # links Homebrew or the Actions toolchain.
      - name: Official Node for the app bundle
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          case "$host_arch" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "::error::Unsupported architecture ${host_arch}"; exit 1 ;;
          esac
          # macos-14 is Apple Silicon, so uname -m is arm64 and the Node
          # dist name is darwin-arm64. darwin-x64 is only for an Intel host.
          echo "host_arch=${host_arch} node_dist_arch=${arch}"
          version=22.23.4
          tarball="node-v${version}-darwin-${arch}.tar.gz"
          mkdir -p build.noindex
          curl -fsSL -o build.noindex/SHASUMS256.txt "https://nodejs.org/dist/v${version}/SHASUMS256.txt"
          # shasum -c opens the filename in the checksum line. Saving the
          # download as node.tar.gz makes it look for node-v*-darwin-*.tar.gz
          # and fail with "No such file or directory".
          curl -fsSL -o "build.noindex/${tarball}" "https://nodejs.org/dist/v${version}/${tarball}"
          (
            cd build.noindex
            grep -F "  ${tarball}" SHASUMS256.txt | shasum -a 256 -c -
          )
          rm -rf build.noindex/node-dist
          mkdir -p build.noindex/node-dist
          tar -xzf "build.noindex/${tarball}" -C build.noindex/node-dist --strip-components=1
          test -x build.noindex/node-dist/bin/node
          echo "BLINKY_NODE=$PWD/build.noindex/node-dist/bin/node" >> "$GITHUB_ENV"

      - name: Mac shell tests
        working-directory: apps/mac-shell
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: swift test

      - name: Bundle plan
        run: |
          pnpm bundle:check
          ./Scripts/bundle.sh --plan

      # bundle.sh writes the app and the zip. dmg.sh --reuse packs that
      # same app, so the disk image and the zip are one build.
      - name: Package
        run: |
          ./Scripts/bundle.sh --zip
          ./Scripts/dmg.sh --reuse
          ls -lh build.noindex/BlinkyBot-*.dmg build.noindex/BlinkyBot-*.zip
          du -sh build.noindex/BlinkyBot.app

      # The packaged server.js is already smoked inside bundle.sh. This opens
      # the signed .app the release is about to publish. A failed suite stops
      # the tag before any asset is uploaded.
      - name: E2E browser
        run: |
          cd e2e
          npm ci
          npx playwright install chromium
      - name: Packaged app end to end
        timeout-minutes: 25
        run: |
          chmod +x e2e/run.sh e2e/ego-real.sh e2e/stubs/ego-browser e2e/stubs/rex
          ./e2e/run.sh build.noindex/BlinkyBot.app
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blinky-e2e
          path: e2e/out
          if-no-files-found: ignore

      - name: Release notes
        run: python3 Scripts/release-notes.py "$VERSION" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release exists — replacing its assets and notes."
            gh release upload "v$VERSION" \
              "build.noindex/BlinkyBot-$VERSION.dmg" \
              "build.noindex/BlinkyBot-$VERSION.zip" \
              --clobber
            gh release edit "v$VERSION" --notes-file notes.md $PRERELEASE
          else
            gh release create "v$VERSION" \
              "build.noindex/BlinkyBot-$VERSION.dmg" \
              "build.noindex/BlinkyBot-$VERSION.zip" \
              --title "BlinkyBot $VERSION" \
              --notes-file notes.md \
              $PRERELEASE
          fi

      # After the zip exists on the release. The feed points at that asset.
      # SPARKLE_PRIVATE_KEY is the base64 Ed25519 seed whose public half is
      # Scripts/sparkle-public-key.txt. It is an Actions secret, not a file.
      - name: Offer it to Sparkle
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$VERSION" in
            *-*)
              echo "Pre-release $VERSION is not written into the feed."
              exit 0
              ;;
          esac
          if [ -z "${SPARKLE_PRIVATE_KEY:-}" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY is not set. Add that Actions secret (the base64 Ed25519 seed for Scripts/sparkle-public-key.txt). Installed copies would never see this release."
            exit 1
          fi
          curl -fsSL -o /tmp/Sparkle-spm.zip "https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-for-Swift-Package-Manager.zip"
          echo "8d5fb41d960b43f4a68aa14126bf62b098544ec8d191cdcc73eb14e63a8e7606  /tmp/Sparkle-spm.zip" | shasum -a 256 -c -
          mkdir -p build.noindex
          unzip -p /tmp/Sparkle-spm.zip bin/sign_update > build.noindex/sign_update
          chmod +x build.noindex/sign_update
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/BlinkyBot-$VERSION.zip"
          SPARKLE_SIGN_UPDATE="$PWD/build.noindex/sign_update" \
            python3 Scripts/appcast.py "$VERSION" "build.noindex/BlinkyBot-$VERSION.zip" "$URL"
          mkdir -p /tmp/blinky-feed
          cp appcast.xml appcast-zh.xml appcast-en.xml /tmp/blinky-feed/
          gh release upload "v$VERSION" appcast.xml appcast-zh.xml appcast-en.xml --clobber
          rm -f appcast.xml appcast-zh.xml appcast-en.xml
          # 0.1.3's SUFeedURL is raw.githubusercontent.com/.../main/appcast.xml.
          # Builds after this change read releases/latest/download/appcast.xml.
          # main rejects a direct push, so the copy 0.1.3 still fetches lands
          # through a pull request.
          git fetch origin main
          git checkout -B "appcast-v$VERSION" origin/main
          cp /tmp/blinky-feed/appcast.xml /tmp/blinky-feed/appcast-zh.xml /tmp/blinky-feed/appcast-en.xml .
          git add appcast.xml appcast-zh.xml appcast-en.xml
          if git diff --cached --quiet -- appcast.xml appcast-zh.xml appcast-en.xml; then
            echo "Feed already offers $VERSION."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Offer $VERSION to Sparkle"
            git push --force origin "HEAD:appcast-v$VERSION"
            existing="$(gh pr list --head "appcast-v$VERSION" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$existing" ]; then
              gh pr create --base main --head "appcast-v$VERSION" \
                --title "Offer $VERSION to Sparkle" \
                --body "Signed appcast from the v$VERSION release. Installed 0.1.3 still reads this file from main."
            fi
            number="$(gh pr list --head "appcast-v$VERSION" --state open --json number --jq '.[0].number // empty')"
            if [ -z "$number" ]; then
              echo "::error::No pull request for appcast-v$VERSION."
              exit 1
            fi
            gh pr merge "$number" --squash --delete-branch
          fi
          offered=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git show origin/main:appcast.xml | grep -q "<sparkle:shortVersionString>$VERSION<"; then
              offered=1
              break
            fi
            sleep $((attempt * 2))
          done
          if [ "$offered" -ne 1 ]; then
            echo "::error::appcast.xml on main does not offer $VERSION."
            exit 1
          fi
          echo "Feed on main offers $VERSION."
