name: Release

# A tag is the whole publish step:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Two jobs share that tag:
#   - mac-app, on macos-14, publishes the GitHub Release (DMG and zip)
#   - engine-image, on ubuntu, pushes the upstream engine image to GHCR
#
# The Mac app is the Phase 1 install. The container image is the upstream
# server path. Sparkle is not part of this workflow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag, such as v0.1.0
        required: true

permissions:
  contents: read

# One release at a time. A second run waits so two uploads of the same tag
# do not replace each other's assets mid-publish.
concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mac-app:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The version lives in VERSION. The tag has to agree with it: the
      # disk image name and CFBundleShortVersionString both come from that
      # file. A mismatch would publish one version under another's name.
      - name: Tag and VERSION must agree
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          FILE="$(tr -d '[:space:]' < VERSION)"
          echo "tag=$TAG  VERSION=$FILE"
          if [ "$TAG" != "$FILE" ]; then
            echo "::error::Tag v$TAG does not match VERSION ($FILE). Bump VERSION, commit, then re-tag."
            exit 1
          fi
          echo "VERSION=$FILE" >> "$GITHUB_ENV"

      - name: The changelog has an entry for this version
        run: |
          if ! python3 Scripts/changelog.py "$VERSION" >/dev/null; then
            echo "::error::CHANGELOG.md has no '## $VERSION' entry. Write it, commit, then re-tag."
            exit 1
          fi
          if ! python3 Scripts/changelog.py "$VERSION" --zh >/dev/null; then
            echo "::error::CHANGELOG.zh-CN.md has no '## $VERSION' entry. Write the Chinese notes, commit, then re-tag."
            exit 1
          fi

      - name: Free disk space
        run: |
          rm -rf ~/Library/Developer/CoreSimulator || true
          sudo rm -rf /Library/Developer/CoreSimulator || true
          df -h /

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: XcodeGen
        run: brew install xcodegen

      # setup-node builds the workspace. The binary copied into the app has
      # to be the official tarball: Scripts/bundle.sh refuses a Node that
      # links Homebrew or the Actions toolchain.
      - name: Official Node for the app bundle
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          case "$host_arch" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "::error::Unsupported architecture ${host_arch}"; exit 1 ;;
          esac
          # macos-14 is Apple Silicon, so uname -m is arm64 and the Node
          # dist name is darwin-arm64. darwin-x64 is only for an Intel host.
          echo "host_arch=${host_arch} node_dist_arch=${arch}"
          version=22.23.4
          tarball="node-v${version}-darwin-${arch}.tar.gz"
          mkdir -p build.noindex
          curl -fsSL -o build.noindex/SHASUMS256.txt "https://nodejs.org/dist/v${version}/SHASUMS256.txt"
          # shasum -c opens the filename in the checksum line. Saving the
          # download as node.tar.gz makes it look for node-v*-darwin-*.tar.gz
          # and fail with "No such file or directory".
          curl -fsSL -o "build.noindex/${tarball}" "https://nodejs.org/dist/v${version}/${tarball}"
          (
            cd build.noindex
            grep -F "  ${tarball}" SHASUMS256.txt | shasum -a 256 -c -
          )
          rm -rf build.noindex/node-dist
          mkdir -p build.noindex/node-dist
          tar -xzf "build.noindex/${tarball}" -C build.noindex/node-dist --strip-components=1
          test -x build.noindex/node-dist/bin/node
          echo "BLINKY_NODE=$PWD/build.noindex/node-dist/bin/node" >> "$GITHUB_ENV"

      - name: Mac shell tests
        working-directory: apps/mac-shell
        run: swift test

      - name: Bundle plan
        run: |
          pnpm bundle:check
          ./Scripts/bundle.sh --plan

      # bundle.sh writes the app and the zip. dmg.sh --reuse packs that
      # same app, so the disk image and the zip are one build.
      - name: Package
        run: |
          ./Scripts/bundle.sh --zip
          ./Scripts/dmg.sh --reuse
          ls -lh build.noindex/BlinkyBot-*.dmg build.noindex/BlinkyBot-*.zip
          du -sh build.noindex/BlinkyBot.app

      - name: Release notes
        run: python3 Scripts/release-notes.py "$VERSION" > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$VERSION" in
            *-*) PRERELEASE="--prerelease" ;;
          esac

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release exists — replacing its assets and notes."
            gh release upload "v$VERSION" \
              "build.noindex/BlinkyBot-$VERSION.dmg" \
              "build.noindex/BlinkyBot-$VERSION.zip" \
              --clobber
            gh release edit "v$VERSION" --notes-file notes.md $PRERELEASE
          else
            gh release create "v$VERSION" \
              "build.noindex/BlinkyBot-$VERSION.dmg" \
              "build.noindex/BlinkyBot-$VERSION.zip" \
              --title "BlinkyBot $VERSION" \
              --notes-file notes.md \
              $PRERELEASE
          fi

  engine-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The two-platform build fills the runner's disk ("No space left on device" on v0.1.0):
      # the preinstalled toolchains it never uses take ~30 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/rerun-engine
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/engine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
