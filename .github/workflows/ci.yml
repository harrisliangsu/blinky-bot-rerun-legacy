name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - run: pnpm -r --if-present ts-check
      - run: pnpm --filter rerun lint
      - run: pnpm --filter rerun test
      - run: pnpm --filter rerun-engine test
      - run: pnpm bundle:check
      - run: python3 Scripts/appcast_test.py

  mac-shell:
    name: Mac shell build, tests, and bundle
    # Opens the built app on the current macOS runner. The release job repeats
    # that open check on macos-14 before it publishes, against the bits it ships.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift build and test
        working-directory: apps/mac-shell
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          swift build
          swift test
      - name: XcodeGen
        run: brew install xcodegen
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Official Node for the app bundle
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          case "$host_arch" in
            arm64) arch=arm64 ;;
            x86_64) arch=x64 ;;
            *) echo "::error::Unsupported architecture ${host_arch}"; exit 1 ;;
          esac
          echo "host_arch=${host_arch} node_dist_arch=${arch}"
          version=22.23.4
          tarball="node-v${version}-darwin-${arch}.tar.gz"
          mkdir -p build.noindex
          curl -fsSL -o build.noindex/SHASUMS256.txt "https://nodejs.org/dist/v${version}/SHASUMS256.txt"
          curl -fsSL -o "build.noindex/${tarball}" "https://nodejs.org/dist/v${version}/${tarball}"
          (
            cd build.noindex
            grep -F "  ${tarball}" SHASUMS256.txt | shasum -a 256 -c -
          )
          rm -rf build.noindex/node-dist
          mkdir -p build.noindex/node-dist
          tar -xzf "build.noindex/${tarball}" -C build.noindex/node-dist --strip-components=1
          test -x build.noindex/node-dist/bin/node
          echo "BLINKY_NODE=$PWD/build.noindex/node-dist/bin/node" >> "$GITHUB_ENV"
      - name: Package
        run: |
          ./Scripts/bundle.sh --zip
          ./Scripts/dmg.sh --reuse
          test -x build.noindex/BlinkyBot.app/Contents/MacOS/BlinkyBot
          test -f build.noindex/BlinkyBot-*.zip
          test -f build.noindex/BlinkyBot-*.dmg
          test -d build.noindex/BlinkyBot.app/Contents/Frameworks/Sparkle.framework
          test "$(plutil -extract SUPublicEDKey raw build.noindex/BlinkyBot.app/Contents/Info.plist)" = "$(tr -d '[:space:]' < Scripts/sparkle-public-key.txt)"
          plutil -extract SUFeedURL raw build.noindex/BlinkyBot.app/Contents/Info.plist | grep -q '/main/appcast.xml'
      - name: Open BlinkyBot and check Compose
        run: |
          chmod +x Scripts/open-smoke.sh
          BLINKY_OPEN_SMOKE_DIR=/tmp/blinky-open-smoke ./Scripts/open-smoke.sh build.noindex/BlinkyBot.app
      - name: Upload Compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-open-logs
          path: /tmp/blinky-open-smoke
          if-no-files-found: ignore