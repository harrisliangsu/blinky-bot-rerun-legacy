name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rerun/contracts build
      - run: pnpm -r --if-present ts-check
      - run: pnpm --filter rerun lint
      - run: pnpm --filter rerun test
      - run: pnpm --filter rerun-engine test
      - run: pnpm bundle:check
      - run: python3 Scripts/appcast_test.py
      - run: node --test e2e/feature-gates.test.mjs e2e/stub.test.mjs e2e/report.test.mjs e2e/rex-hook.test.mjs
      - run: python3 e2e/sparkle_sign_test.py

  mac-shell:
    name: Mac shell tests
    # Swift tests only. The packaged app is installed and exercised by the E2E workflow.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift build and test
        working-directory: apps/mac-shell
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          swift build
          swift test

  real-cli-smoke:
    name: Real agent CLI smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - id: secrets
        env:
          CODEX: ${{ secrets.CODEX_API_KEY }}
          KIMI: ${{ secrets.KIMI_API_KEY }}
          GROK: ${{ secrets.XAI_API_KEY }}
          CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${CODEX}${KIMI}${GROK}${CLAUDE}${ANTHROPIC}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Codex, Kimi, Grok, or Claude secret is configured. Skipping the real CLI smoke." >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.secrets.outputs.present == 'true'
        env:
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLINKY_REAL_CLI: "1"
        run: |
          set -euo pipefail
          if [ -n "${CODEX_API_KEY:-}" ] && ! command -v codex >/dev/null; then npm install -g @openai/codex; fi
          if [ -n "${KIMI_API_KEY:-}" ] && ! command -v kimi >/dev/null; then npm install -g @moonshot-ai/kimi-code; fi
          if [ -n "${XAI_API_KEY:-}" ] && ! command -v grok >/dev/null; then npm install -g @xai-official/grok; fi
          if { [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ] || [ -n "${ANTHROPIC_API_KEY:-}" ]; } && ! command -v claude >/dev/null; then npm install -g @anthropic-ai/claude-code; fi
          pnpm install --frozen-lockfile
          pnpm --filter @rerun/contracts build
          pnpm --filter rerun-engine exec vitest run src/agents/cli-adapters/real-cli.smoke.test.ts
